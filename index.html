<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico Random</title><style>
body {
  background: #222;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 60px 15px;
}

h1 { color: #ff9999; }

button {
  background: #ff6699;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 18px 40px;
  font-size: 20px;
  cursor: pointer;
}

#status { margin: 30px; }
</style></head><body><h1>🎲 Nico Random</h1>
<p>Tag: Akira,Jeans&Chinpo</p><button id="drawButton" onclick="randomVideo()">
  ランダム再生！
</button><div id="status"></div><script>
async function randomVideo() {

  const status = document.getElementById("status");
  const button = document.getElementById("drawButton");

  button.disabled = true;
  status.textContent = "動画を探しています...";

  const api =
    "https://snapshot.search.nicovideo.jp/api/v2/snapshot/video/contents/search";

  const params = new URLSearchParams({
    q: "Akira,Jeans&Chinpo",
    targets: "tagsExact",
    fields: "contentId,title",
    _sort: "-viewCounter",
    _offset: "0",
    _limit: "100",
    _context: "NicoRandom"
  });

  try {
    const response = await fetch(api + "?" + params);

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    if (!result.data || result.data.length === 0) {
      status.textContent = "動画が見つかりませんでした";
      return;
    }

    const videos = result.data;

    const randomIndex = Math.floor(
      Math.random() * videos.length
    );

    const video = videos[randomIndex];

    status.textContent = video.title;

    window.location.href =
      "https://www.nicovideo.jp/watch/" + video.contentId;

  } catch (error) {
    status.textContent = "エラー: " + error.message;
    console.error(error);
  } finally {
    button.disabled = false;
  }
}
</script></body>
</html>
